services:
  # Backend API (Express + PostgreSQL). Frontend is hosted on Vercel.
  - type: web
    name: hotel-booking-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Postgres connection string, e.g. from Neon or Supabase
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # your Vercel URL, e.g. https://hotel-booking.vercel.app
      - key: APP_URL
        sync: false # same as CLIENT_URL; used in emails and Stripe redirects
      - key: STRIPE_SECRET_KEY
        sync: false # optional
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # optional
